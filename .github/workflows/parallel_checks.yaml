name: Parallelization Checks

on:
  pull_request:
    branches:
    - main
    - '*-stable'
  push:
    branches:
    - main
    - '*-stable'
  workflow_dispatch:

jobs:
  # Real non-Linux coverage: run the futurized functions under a
  # non-sequential plan on genuine Windows and macOS runners. This job
  # can go red if multisession hangs or serializes incorrectly.
  native-parallel:
    name: native-parallel (${{ matrix.os }}, multisession)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::future
            any::R.utils
          needs: check

      - name: Smoke test under multisession
        env:
          SEURAT_CI_PLAN: multisession
          SEURAT_CI_WORKERS: "2"
          SEURAT_CI_TIMEOUT: "900"
        run: Rscript inst/ci/parallel_smoke.R

  # Prove the Windows-user Docker path delivers working multicore.
  docker-multicore:
    name: docker-multicore (multicore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t seurat-parallel:ci .

      - name: Smoke test multicore inside container
        run: docker run --rm seurat-parallel:ci
